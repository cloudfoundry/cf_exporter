name: Tag Release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 20 * *'  # Monthly on the 20th at 00:00 UTC

permissions:
  contents: read

concurrency:
  group: tag-patch-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.CF_PROM_CI_BOT_TOKEN }}

      - name: Check release baseline
        id: baseline
        shell: bash
        run: |
          latest_tag=$(git tag --list --sort=version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { tag=$0 } END { print tag }')

          if [[ -z "$latest_tag" ]]; then
            echo "::error::No stable vMAJOR.MINOR.PATCH tag found."
            exit 1
          fi

          if [[ "$(git rev-parse "$latest_tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then
            echo "::error::The latest commit is already tagged as $latest_tag."
            exit 1
          fi

          echo "previous_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create and push next release tag
        id: tag
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.CF_PROM_CI_BOT_TOKEN }}
          previous_tag: ${{ steps.baseline.outputs.previous_tag }}
          commit_sha: ${{ steps.baseline.outputs.commit_sha }}
          release_branches: ${{ github.event.repository.default_branch }}
          tag_prefix: v
          create_annotated_tag: true
          fetch_all_tags: true

      - name: Summarize release
        if: steps.tag.outputs.new_tag != ''
        env:
          COMMIT_SHA: ${{ steps.baseline.outputs.commit_sha }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          echo "Tagged $COMMIT_SHA as $NEW_TAG." >> "$GITHUB_STEP_SUMMARY"
